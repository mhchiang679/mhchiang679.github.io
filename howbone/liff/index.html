<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>重慶骨科｜線上掛號（測試版）</title>
<style>
  :root{
    --blue:#004080; --blue2:#0060a8; --red:#d9534f; --red-d:#c9302c; --gold:#f7b500;
    --sky:#f0f8ff; --bg:#f9f9f9; --off:#ffeeee; --ink:#333; --muted:#888; --line:#eee; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,Arial,"微軟正黑體","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
  h1,h2,h3,h4{color:var(--blue);margin:0}
  a{color:var(--blue2);text-decoration:none}
  button{font:inherit;cursor:pointer}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(5px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px}
  .brand{font-size:1.2rem;font-weight:700;color:var(--blue);white-space:nowrap}
  .who{display:flex;align-items:center;gap:6px;font-size:.95rem;color:var(--muted)}
  .who select{font:inherit;font-weight:700;color:var(--blue);border:1px solid #cfe0f2;background:var(--sky);border-radius:20px;padding:6px 12px;max-width:170px}
  .testbar{background:#fff7e0;color:#7a5a00;font-size:.85rem;text-align:center;padding:4px 12px;border-top:1px solid #f3e2b0}
  section{padding:24px 16px}
  section.alt{background:var(--bg)}
  .sec-title{text-align:center;font-size:1.35rem;margin-bottom:18px}
  .card{background:#fff;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.08);border:1px solid var(--line)}
  .pad{padding:18px}
  .stack>*+*{margin-top:12px}
  .muted{color:var(--muted)}
  .small{font-size:.9rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:24px;border:0;font-weight:700;font-size:1rem;transition:background .2s}
  .btn-red{background:var(--red);color:#fff}.btn-red:active{background:var(--red-d)}
  .btn-blue{background:var(--blue2);color:#fff}
  .btn-ghost{background:#eef3f8;color:var(--blue)}
  .btn-line{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn-block{display:flex;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>.btn{flex:1 1 140px}
  .tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:12px;background:#e8f1fb;color:var(--blue2)}
  .tag.red{background:var(--off);color:var(--red)} .tag.gold{background:#fff4d6;color:#8a6400} .tag.green{background:#e7f5ea;color:var(--ok)} .tag.grey{background:#eee;color:#777}
  /* queue */
  #queue{background:var(--blue);color:#fff}
  #queue .sec-title{color:#fff}
  .q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .q-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:18px 12px;text-align:center}
  .q-name{font-weight:700;color:#e1f0f6;font-size:1.1rem}
  .q-no{color:var(--gold);font-size:3.2rem;font-weight:700;line-height:1.1}
  .q-note{font-size:.85rem;opacity:.85;margin-top:10px;text-align:center}
  /* hero */
  .hero{display:grid;background:#333}
  .slide{grid-area:1/1;position:relative;opacity:0;transition:opacity 1s}
  .slide.on{opacity:1}
  .slide img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
  .slide .cap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(0,0,0,.45);color:#fff;padding:16px}
  .slide h2{color:#fff;font-size:1.6rem;text-shadow:2px 2px 5px rgba(0,0,0,.7)}
  .slide p{margin:6px 0 0;text-shadow:1px 1px 4px rgba(0,0,0,.7)}
  /* doctors */
  .doc{overflow:hidden}
  .doc img{width:100%;display:block;background:#eee}
  .doc h3{font-size:1.3rem}
  .doc .title{color:var(--red);font-weight:700;margin:2px 0 10px}
  .doc .exp{white-space:pre-wrap;margin:0 0 12px}
  .spec{background:var(--sky);padding:12px;border-radius:6px}
  .next{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
  .svc{border-top:4px solid var(--blue2)}
  .svc p{white-space:pre-wrap;margin:8px 0 0}
  /* tables */
  .tbl-wrap{overflow-x:auto;padding:10px}
  table.sch{border-collapse:collapse;min-width:520px;width:100%;text-align:center;font-size:.92rem}
  table.sch th{background:var(--blue);color:#fff;padding:10px 6px;border:1px solid #ddd}
  table.sch.rehab th{background:var(--blue2)}
  table.sch td{padding:10px 6px;border:1px solid #ddd}
  table.sch td.slot{font-weight:700;background:var(--bg);white-space:nowrap}
  table.sch td.off{color:var(--red);background:var(--off)}
  /* form */
  label.f{display:block;font-weight:700;margin:14px 0 6px}
  input.in,select.in{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:1px solid #ccd6e0;border-radius:8px;background:#fff}
  .dob{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
  .err{color:var(--red);font-size:.9rem;margin-top:6px}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
  .check input{width:22px;height:22px;margin-top:3px;flex:none}
  details.notice{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.9rem}
  details.notice summary{cursor:pointer;color:var(--blue2);font-weight:700}
  /* book */
  .steps{display:flex;gap:4px;font-size:.82rem;margin-bottom:14px}
  .steps span{flex:1;text-align:center;padding:6px 2px;border-bottom:3px solid #dde6ef;color:var(--muted)}
  .steps span.on{border-color:var(--red);color:var(--ink);font-weight:700}
  .hscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid #d6e2ee;background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;color:var(--blue)}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .day{flex:none;width:60px;border:1px solid #d6e2ee;background:#fff;border-radius:10px;padding:6px 0;text-align:center;line-height:1.3}
  .day b{display:block;font-size:1.15rem}
  .day small{color:var(--muted)}
  .day.on{background:var(--blue);border-color:var(--blue);color:#fff}.day.on small{color:#cfe0f2}
  .day.none{opacity:.4}
  .day i{display:block;width:6px;height:6px;border-radius:3px;background:var(--ok);margin:3px auto 0}
  .day.none i{background:transparent}
  .ava{flex:none;text-align:center;width:72px;background:none;border:0;padding:0;color:var(--ink)}
  .ava img,.ava .all{width:56px;height:56px;border-radius:28px;object-fit:cover;object-position:top;border:3px solid transparent;display:block;margin:0 auto;background:var(--sky)}
  .ava .all{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue)}
  .ava.on img,.ava.on .all{border-color:var(--red)}
  .ava span{font-size:.85rem}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
  .tg{position:relative;width:52px;height:30px;flex:none}
  .tg input{opacity:0;width:0;height:0}
  .tg span{position:absolute;inset:0;background:#ccd6e0;border-radius:15px;transition:.2s}
  .tg span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:12px;transition:.2s}
  .tg input:checked+span{background:var(--blue2)}
  .tg input:checked+span:before{transform:translateX(22px)}
  .sess{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .sess h4{font-size:1.1rem}
  .empty{text-align:center;color:var(--muted);padding:28px 10px}
  /* appts */
  .appt .big{display:flex;align-items:baseline;gap:6px}
  .appt .big b{font-size:2rem;color:var(--blue)}
  .live{background:var(--blue);color:#fff;border-radius:10px;padding:12px;margin-top:10px;display:flex;justify-content:space-around;text-align:center}
  .live b{display:block;color:var(--gold);font-size:1.8rem;line-height:1.2}
  .seg{display:flex;background:#eef3f8;border-radius:22px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:18px;font-weight:700;color:var(--blue)}
  .seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .grp{font-weight:700;color:var(--blue);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  /* family */
  .mem{display:flex;gap:12px;align-items:flex-start}
  .mem .av{width:46px;height:46px;border-radius:23px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;flex:none}
  .mem .body{flex:1;min-width:0}
  /* nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;color:#999;font-size:.82rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.tabs button svg{width:26px;height:26px}
  nav.tabs button.on{color:var(--blue)}
  /* modal + toast */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h3{font-size:1.3rem;margin-bottom:10px}
  .kv{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;margin:12px 0}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:22px;z-index:120;font-size:.95rem;max-width:90vw;text-align:center}
  .hide{display:none!important}
  footer.f{background:#222;color:#ccc;padding:24px 16px;font-size:.9rem}
  footer.f a{color:#ddd}
</style>
</head>

function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function md(s){var d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'}
function hm(min){return pad(Math.floor(min/60))+':'+pad(min%60)}
function toMin(s){s=String(s).replace(':','');return +s.slice(0,s.length-2)*60 + +s.slice(-2)}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function today(){return ymd(new Date())}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function uid(){return Math.random().toString(36).slice(2,10)}
function surname(n){return (n||'').slice(0,1)}
function rocToAd(y,m,d){return (1911 + +y)+'-'+pad(+m)+'-'+pad(+d)}
function ageOf(birth){var b=parseYmd(birth),t=new Date();var a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()==b.getMonth()&&t.getDate()<b.getDate()))a--;return a}
function rocText(birth){var b=parseYmd(birth);return '民國 '+(b.getFullYear()-1911)+'/'+(b.getMonth()+1)+'/'+b.getDate()}
function maskId(id){return id? id.slice(0,3)+'****'+id.slice(-3):''}
function validId(id){
  if(!/^[A-Z][1289]\d{8}$/.test(id)) return false;
  var L='ABCDEFGHJKLMNPQRSTUVXYWZIO', n=L.indexOf(id[0])+10;
  var d=[Math.floor(n/10),n%10].concat(id.slice(1).split('').map(Number)), w=[1,9,8,7,6,5,4,3,2,1,1];
  return d.reduce(function(s,x,i){return s+x*w[i]},0)%10===0;
}
function isNight(){var m=nowMin();return m>=23*60+30||m<5*60}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function sheet(html, onMount){
  var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  m.addEventListener('click',function(e){if(e.target===m)m.remove()});
  document.body.appendChild(m); if(onMount) onMount(m, function(){m.remove()}); return m;
}

function ihis(fn, body){
  var urls=CONFIG.IHIS_URLS.slice();
  function tryNext(){
    if(!urls.length) return Promise.reject(new Error('no url'));
    var u=urls.shift(), ctl=('AbortController' in window)?new AbortController():null;
    var t=setTimeout(function(){ctl&&ctl.abort()},6000);
    return fetch(u+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl&&ctl.signal})
      .then(function(r){clearTimeout(t);return r.json()})
      .then(function(j){if(j.RTN_CODE!=='0')throw new Error(j.RTN_MSG||'RTN_CODE');return j})
      .catch(function(e){clearTimeout(t);return tryNext()});
  }
  return tryNext();
}
function slotFromLabel(label){ var m=String(label).match(/(\d{1,2}):(\d{2})\s*[~～\-–]\s*(\d{1,2}):(\d{2})/); return m? [(+m[1])*60+ +m[2], (+m[3])*60+ +m[4]] : [510,720] }
function apnFromLabel(label){ return /上午|早/.test(label)?'1':/下午|午/.test(label)?'2':'3' }

/* 依試算表門診時刻表產生 28 天模擬班表（J01 格式） */
function mockSchedule(){
  var out=[], d0=new Date(); d0.setHours(0,0,0,0);
  for(var i=0;i<28;i++){
    var d=addDays(d0,i), wd=d.getDay(); if(wd===0) continue;
    DATA.schedule.forEach(function(row){
      var doc=row[wd]; if(!doc||doc==='休診') return;
      var se=slotFromLabel(row[0]), apn=apnFromLabel(row[0]), key=ymd(d)+apn;
      var h=hash(key+doc), qty=h%24, next=qty+1;
      if(h%17===0) next=0; if(h%31===0) next=-1;
      out.push({SCH_DATE:ymd(d).replace(/-/g,''),SCH_APN:apn,CLINIC_NO:'01',CLINIC_NA:'一診',ST_TIME:hm(se[0]).replace(':',''),END_TIME:hm(se[1]).replace(':',''),DOCT_CODE:'D'+(hash(doc)%900+100),DOCT_NAME:doc,DIV_NAME:'骨科',VIEW_QTY:qty,NEXT_VIEW:next,NEXT_TIME:hm(Math.min(se[0]+qty*6,se[1]-5)).replace(':','')});
    });
  }
  return out;
}
function loadSchedule(){
  if(!CONFIG.LIVE_READ){SCHED=mockSchedule();return Promise.resolve()}
  var s=new Date(), e=addDays(s,27);
  return ihis('J01',{HOSP_ID:CONFIG.HOSP_ID,ST_DATE:ymd(s).replace(/-/g,''),END_DATE:ymd(e).replace(/-/g,'')})
    .then(function(j){ if(!j.SCH_LST||!j.SCH_LST.length) throw 0; SCHED=j.SCH_LST; SCHED_SRC='iHIS 即時'; })
    .catch(function(){ SCHED=mockSchedule(); SCHED_SRC='示範'; });
}

function schDate(s){return s.SCH_DATE.slice(0,4)+'-'+s.SCH_DATE.slice(4,6)+'-'+s.SCH_DATE.slice(6,8)}
function sessionNow(){
  var t=today(), m=nowMin();
  return (SCHED||[]).filter(function(s){return schDate(s)===t && toMin(s.ST_TIME)<=m && m<=toMin(s.END_TIME)})[0]||null;
}
function nextSession(){
  var t=today(), m=nowMin();
  return (SCHED||[]).filter(function(s){var d=schDate(s);return d>t||(d===t&&toMin(s.ST_TIME)>m)})
    .sort(function(a,b){return (a.SCH_DATE+a.ST_TIME)<(b.SCH_DATE+b.ST_TIME)?-1:1})[0]||null;
}
function sessKey(s){return s.SCH_DATE+s.SCH_APN+s.CLINIC_NO}
/* 狀態：可掛 / 額滿 / 停診 / 看診中 / 現場停止掛號 / 已結束 */
function sessState(s){
  var d=schDate(s), m=nowMin(), extra=S.taken[sessKey(s)]||0;
  if(s.NEXT_VIEW===-1) return {k:'off',t:'停診'};
  if(s.NEXT_VIEW===0) return {k:'full',t:'額滿'};
  if(d===today()){
    if(m>toMin(s.END_TIME)) return {k:'end',t:'已結束'};
    if(m>toMin(s.END_TIME)-30) return {k:'stop',t:'現場停止掛號'};
    if(m>=toMin(s.ST_TIME)) return {k:'open',t:'看診中', live:true};
  }
  return {k:'open',t:'可掛'};
}
function nextNo(s){var extra=S.taken[sessKey(s)]||0; return {no:s.NEXT_VIEW+extra, time:hm(Math.min(toMin(s.NEXT_TIME)+extra*6, toMin(s.END_TIME)+60))}}
function doctorPhoto(name){var r=DATA.team.filter(function(t){return name&&name.indexOf(t[0])>=0||t[0].indexOf(name)>=0})[0];return r?r[4]:''}
function doctorTitle(name){var r=DATA.team.filter(function(t){return name.indexOf(t[0])>=0||t[0].indexOf(name)>=0})[0];return r?r[0]+' '+r[1]:name}
function nearest(docName){

    .sort(function(a,b){return (a.SCH_DATE+a.ST_TIME)<(b.SCH_DATE+b.ST_TIME)?-1:1})[0]||null;
}

  h+='<p class="small muted" style="margin-top:16px">可於「我的預約」自行取消，每月最多 '+CONFIG.SELFPAY_CANCEL_LIMIT+' 次。治療師班表與名額為示範資料。</p></section>';
  v.innerHTML=h; bindGo(v);
  $$('[data-p]',v).forEach(function(b){b.onclick=function(){current=b.dataset.p;render()}});
  $$('[data-item]',v).forEach(function(b){b.onclick=function(){sp.item=b.dataset.item;render()}});
  $$('[data-th]',v).forEach(function(b){b.onclick=function(){sp.therapist=b.dataset.th;render()}});
  $$('[data-sd]',v).forEach(function(b){b.onclick=function(){sp.date=b.dataset.sd;render()}});
  $$('[data-t]',v).forEach(function(b){b.onclick=function(){confirmSelfpay(p,item,b.dataset.t)}});
}
function slots(date,item){
  var out=[], d=parseYmd(date).getDay(), ranges=[[540,720],[870,1050]]; if(d===6) ranges=[[540,720]];
  ranges.forEach(function(r){ for(var t=r[0]; t+item.minutes<=r[1]; t+=item.minutes<=20?20:30){
    var k=date+hm(t)+sp.therapist, mine=S.bookings.some(function(b){return b.type==='selfpay'&&b.status!=='cancelled'&&b.date===date&&b.time===hm(t)&&b.therapist===sp.therapist});
    out.push({t:hm(t), taken: mine || hash(k)%3===0});
  }});
  return out;
}
function confirmSelfpay(p,item,time){
  sheet('<h3>確認預約</h3><dl class="kv"><dt>看診人</dt><dd>'+esc(p.name)+'</dd><dt>項目</dt><dd>'+esc(item.name)+'（'+item.minutes+' 分鐘）</dd><dt>治療師</dt><dd>'+esc(sp.therapist)+'</dd><dt>時間</dt><dd>'+md(sp.date)+' '+time+'</dd><dt>費用</dt><dd>'+esc(item.price||'自費，費用請洽櫃檯')+'</dd></dl><div class="row"><button class="btn btn-ghost" data-x>返回</button><button class="btn btn-red" data-ok>確認預約</button></div>',
  function(m,close){
    $('[data-x]',m).onclick=close;
    $('[data-ok]',m).onclick=function(){
      close();
      var b={id:uid(), key:p.key, type:'selfpay', item:item.name, minutes:item.minutes, therapist:sp.therapist, date:sp.date, time:time, price:item.price, status:'booked', by:S.self.name, at:Date.now()};
      S.bookings.push(b); save();
      sheet('<h3>預約成功</h3><dl class="kv"><dt>看診人</dt><dd>'+esc(p.name)+'</dd><dt>項目</dt><dd>'+esc(b.item)+'</dd><dt>時間</dt><dd>'+md(b.date)+' '+b.time+'</dd><dt>治療師</dt><dd>'+esc(b.therapist)+'</dd></dl><p>可於「我的預約」自行取消（每月 '+CONFIG.SELFPAY_CANCEL_LIMIT+' 次內）。</p><button class="btn btn-red btn-block" data-a>我的預約</button>',
        function(m2,c2){$('[data-a]',m2).onclick=function(){c2();apptSeg='selfpay';go('appts')}});
      sendCard(Flex.selfpaySuccess({patient:p.name, relation:p.key==='self'?'本人':p.relation, item:b.item, minutes:b.minutes, therapist:b.therapist, date:md(b.date), time:b.time, price:b.price, limit:CONFIG.SELFPAY_CANCEL_LIMIT, liff:LIFF.url}),'已傳送「預約成功」卡片');
    };
  });
}

/* =========================================================
   測試工具
   ========================================================= */
function devTools(){
  var keys=Object.keys(Flex.samples);
  var names={welcome:'常用功能（歡迎）',bookingSuccess:'掛號成功',proxyBooked:'家人代掛通知',remindDayBefore:'前一日提醒',remindToday:'當日提醒',queueWatch:'顧號碼',cancelled:'取消成功',rescheduled:'改期成功',selfpaySuccess:'自費預約成功',selfpayRemind:'自費前一日提醒',familyInvite:'家族群邀請',nightQueue:'夜間排隊結果'};
  return '<section class="alt"><h3 style="font-size:1.1rem">測試工具</h3><p class="small muted">LIFF：'+(LIFF.ok?(LIFF.inClient?'已在 LINE 內開啟':'已初始化（外部瀏覽器）'):'未設定 LIFF ID，以示範模式執行')+'｜班表：'+SCHED_SRC+'｜燈號：'+LED_SRC+'</p>'+
    '<label class="f" for="devcard">傳送範例卡片到聊天室</label><div class="row"><select class="in" id="devcard" style="flex:2 1 180px">'+keys.map(function(k){return '<option value="'+k+'">'+(names[k]||k)+'</option>'}).join('')+'</select><button class="btn btn-blue" id="devsend">傳送</button></div>'+
    '<button class="btn btn-line btn-block" style="margin-top:14px" id="devreset">清除所有測試資料</button></section>';
}
function wireDev(v){
  var s=$('#devsend',v); if(!s) return;
  s.onclick=function(){ var k=$('#devcard',v).value, d=Object.assign({liff:LIFF.url},Flex.samples[k]); if(k==='welcome'){d.bound=!!S.self;d.name=S.self?S.self.name:(LIFF.profile&&LIFF.profile.displayName)} sendCard(Flex[k](d)) };
  $('#devreset',v).onclick=function(){ confirmSheet('清除測試資料','綁定、家族群、預約都會清除，無法復原。','清除',function(){S=blank();save();current=null;toast('已清除');go('home')},true) };
}

/* =========================================================
   啟動
   ========================================================= */
(function start(){
  $('#view').innerHTML='<div class="empty" style="padding:80px 0">載入中…</div>';
  initLiff().then(function(){
    var p=new URLSearchParams(location.search);
    route.tab=p.get('tab')||'home'; if(p.get('doctor')) route.params.doctor=p.get('doctor'); if(p.get('item')) route.params.item=p.get('item');
    // 先用備用資料立刻顯示，背景再讀試算表與 iHIS，讀到後更新畫面
    SCHED=mockSchedule(); mockLed(); processQueued(); render();
    var refresh=function(){ if(!$('.mask') && (route.tab==='home'||route.tab==='book')) render(); else renderQueue() };
    loadSheets().then(function(){ $('#brand').textContent=CONFIG.CLINIC; if(SCHED_SRC==='示範') SCHED=mockSchedule(); refresh() });
    loadSchedule().then(loadLed).then(refresh);
    setInterval(function(){ loadLed().then(renderQueue) }, 60000);
  });
})();
</script>
